name: GES Automated CalVer Release Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  models: read
  id-token: write
  attestations: write

jobs:
  release:
    name: Auto-Tag, AI Summary & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Target Version from data/version.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./data/version.json').version")
          DATE=$(node -p "require('./data/version.json').releaseDate")
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check If Git Tag Exists
        id: check_tag
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists. Skipping release creation."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist. Proceeding with release."
          fi

      - name: Generate AI Executive Release Summary (GitHub Models)
        id: ai_notes
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMITS=$(git log -n 5 --pretty=format:"- %s (%h)" | tr '\n' ' ')
          cat << 'EOF' > generate_notes.js
          const https = require('https');
          const fs = require('fs');
          const ver = process.env.REL_VER;
          const date = process.env.REL_DATE;
          const commits = process.env.REL_COMMITS || '';
          const fallback = `### Gayatri Electrical Services — Release v${ver} (${date})\n\nAutomated production deployment validated across all 7 repository integrity, locale parity (EN/HI/MR), and web standards stages.\n`;
          fs.writeFileSync('release-notes.md', fallback, 'utf-8');

          const payload = JSON.stringify({
            model: 'openai/gpt-4o-mini',
            messages: [
              { role: 'system', content: 'You are a concise release notes writer for Gayatri Electrical Services (GES), an enterprise electrical contractor website. Write a 3-bullet markdown summary of the recent commit log.' },
              { role: 'user', content: `Version: v${ver} (${date}). Recent commits: ${commits}` }
            ],
            max_tokens: 220,
            temperature: 0.2
          });

          const req = https.request('https://models.github.ai/inference/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(payload)
            },
            timeout: 8000
          }, (res) => {
            let body = '';
            res.on('data', d => body += d);
            res.on('end', () => {
              try {
                if (res.statusCode === 200) {
                  const parsed = JSON.parse(body);
                  const aiText = parsed.choices && parsed.choices[0] && parsed.choices[0].message && parsed.choices[0].message.content;
                  if (aiText) {
                    fs.writeFileSync('release-notes.md', `### 🤖 AI Release Summary — GES v${ver} (${date})\n\n${aiText.trim()}\n`, 'utf-8');
                    console.log('Generated AI release summary via GitHub Models.');
                  }
                }
              } catch (e) {}
              process.exit(0);
            });
          });
          req.on('error', () => process.exit(0));
          req.on('timeout', () => { req.destroy(); process.exit(0); });
          req.write(payload);
          req.end();
          EOF
          REL_VER="${{ steps.get_version.outputs.version }}" REL_DATE="${{ steps.get_version.outputs.date }}" REL_COMMITS="$COMMITS" node generate_notes.js
          rm -f generate_notes.js

      - name: Build Production Release Bundle (.zip)
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          BUNDLE="ges-${{ steps.get_version.outputs.tag }}-production.zip"
          zip -r "$BUNDLE" \
            index.html 404.html CNAME robots.txt sitemap.xml \
            llms.txt llms-full.txt sw.js \
            ges2026indexnowkeybhiwandi9999.txt \
            .well-known/ assets/ css/ data/ images/ js/

      - name: Attest Build Provenance (SLSA Cryptographic Signature)
        if: steps.check_tag.outputs.exists == 'false'
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ges-${{ steps.get_version.outputs.tag }}-production.zip

      - name: Create Git Tag & GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "Gayatri Electrical Services ${{ steps.get_version.outputs.tag }} (${{ steps.get_version.outputs.date }})"
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: ges-${{ steps.get_version.outputs.tag }}-production.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Search Engines for Instant Indexing (IndexNow & Googlebot)
        if: steps.check_tag.outputs.exists == 'false'
        run: node scripts/ping-sitemap.js

      - name: Publish Release Summary
        if: always()
        run: |
          echo "### 🚀 Gayatri Electrical Services — Release Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Tag**: \`${{ steps.get_version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Date**: \`${{ steps.get_version.outputs.date }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Already Tagged**: \`${{ steps.check_tag.outputs.exists }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f release-notes.md ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat release-notes.md >> $GITHUB_STEP_SUMMARY
            rm -f release-notes.md
          fi
