name: GES Automated CalVer Release Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Auto-Tag & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Target Version from data/version.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./data/version.json').version")
          DATE=$(node -p "require('./data/version.json').releaseDate")
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check If Git Tag Exists
        id: check_tag
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists. Skipping release creation."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist. Proceeding with release."
          fi

      - name: Build Production Release Bundle (.zip)
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          BUNDLE="ges-${{ steps.get_version.outputs.tag }}-production.zip"
          zip -r "$BUNDLE" \
            index.html 404.html CNAME robots.txt sitemap.xml \
            llms.txt llms-full.txt sw.js \
            ges2026indexnowkeybhiwandi9999.txt \
            .well-known/ assets/ css/ data/ images/ js/

      - name: Create Git Tag & GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "Gayatri Electrical Services ${{ steps.get_version.outputs.tag }} (${{ steps.get_version.outputs.date }})"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: ges-${{ steps.get_version.outputs.tag }}-production.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Search Engines for Instant Indexing (IndexNow & Googlebot)
        if: steps.check_tag.outputs.exists == 'false'
        run: node scripts/ping-sitemap.js

      - name: Publish Release Summary
        if: always()
        run: |
          echo "### 🚀 Gayatri Electrical Services — Release Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Tag**: \`${{ steps.get_version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Date**: \`${{ steps.get_version.outputs.date }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Already Tagged**: \`${{ steps.check_tag.outputs.exists }}\`" >> $GITHUB_STEP_SUMMARY
