# Gayatri Electrical Services (GES) — Automated Security & Dependency Monitor
# Note: open-pull-requests-limit is set to 0 to disable automated version-update PRs
# while retaining dependency graph awareness for the sole maintainer workflow.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci(actions)"
